[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["bcryptjs", "@netlify/database"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
